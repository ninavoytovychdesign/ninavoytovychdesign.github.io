:root{--bg:#F5F5F5;--ink:#08080B;--t2:#55555E;--t3:#8A8A93;--line:rgba(40,40,70,.12);--acc:#E1E635;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1344px;margin:0 auto;padding:96px 48px}
.label{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
h1{font:500 64px/68px Outfit;letter-spacing:-2px;margin:12px 0 16px}
.lead{max-width:560px;color:var(--t2);font-size:18px;line-height:28px;margin:0}
.hero{display:grid;grid-template-columns:1fr 560px;gap:48px;align-items:center}
@media (max-width:1023px){.hero{grid-template-columns:1fr}.wrap{padding:64px 20px}h1{font-size:40px;line-height:44px}}
.slot{position:relative;width:min(560px,100%);aspect-ratio:1}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
body.r3open .slot svg{opacity:0;transition:opacity .2s linear .95s}
.slot .nm{font:400 11px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;fill:var(--t2)}
.slot .yy{font:400 10px Mono,monospace;letter-spacing:1px;fill:var(--t3)}
.open-btn{position:absolute;inset:0;background:none;border:0;cursor:zoom-in;border-radius:50%}
.open-btn:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.hint{margin-top:16px;font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t3);text-align:center}

@property --sw{syntax:'<angle>';inherits:true;initial-value:0deg}
/* entering: the radar beam turns once and switches the page into the misty space */
#veil,#view{--sw:0deg;transition:--sw 1.05s cubic-bezier(.55,0,.3,1)}
#veil.in,#view.in{--sw:360deg}
#veil{position:fixed;inset:0;z-index:52;pointer-events:none;
  background:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),transparent max(0deg,calc(var(--sw) - 26deg)),rgba(8,8,11,.06) calc(var(--sw) - 1.2deg),rgba(8,8,11,.55) calc(var(--sw) - 0.15deg),transparent var(--sw))}
#veil.full{display:none}#veil[hidden]{display:none}
#view{position:fixed;inset:0;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink);
  background:radial-gradient(130% 90% at 50% 0%,#E9EAEE 0%,#CFD2D9 45%,#A7AAB4 100%);
  -webkit-mask:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),#000 0deg,#000 max(0deg,calc(var(--sw) - 1deg)),transparent var(--sw));
  mask:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),#000 0deg,#000 max(0deg,calc(var(--sw) - 1deg)),transparent var(--sw))}
#view.full{-webkit-mask:none;mask:none}
#view[hidden]{display:none}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.75) 1px,transparent 1.5px);background-size:120px 120px}
#view canvas{position:absolute;inset:0;display:block;z-index:1}
#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
#lines path{fill:none;stroke:rgba(8,8,11,.55);stroke-width:1;transition:opacity .3s}
#lines path.plus{stroke:rgba(8,8,11,.7)}
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}
.co{position:absolute;left:0;top:0;display:grid;gap:2px;padding:0 0 0 8px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;white-space:nowrap}
.co.left{text-align:right;padding:0 8px 0 0;translate:-100% 0}
.co.show{opacity:1;visibility:visible}
.co .k{font:400 12px/16px Mono,monospace;letter-spacing:2px;color:var(--ink);translate:0 -100%}
.co .v{font:400 14px/18px Outfit;color:rgba(8,8,11,.7);translate:0 -100%}
.co-a .v{font:500 22px/26px Outfit;letter-spacing:-.5px;color:var(--ink)}
.co .go{margin-top:6px;justify-self:start;pointer-events:auto;padding:6px 10px;border:1px solid var(--ink);background:rgba(255,255,255,.4);color:var(--ink);font:500 11px/14px Mono,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;translate:0 -100%;transition:background-color .25s,color .25s}
.co .go:hover{background:var(--ink);color:#fff}
.co .go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ui{position:fixed;z-index:60;display:none}
body.r3open .ui{display:flex}
.ui-top{top:20px;left:20px;right:20px;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;animation:uiIn .6s var(--e) 1.6s forwards}
.ui-top>*{pointer-events:auto}
@keyframes uiIn{to{opacity:1}}
.ttl{display:grid;gap:4px}.ttl b{font:500 28px/32px Outfit;letter-spacing:-1px}.ttl span{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:rgba(8,8,11,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 16px;border:1px solid var(--ink);background:rgba(255,255,255,.5);color:var(--ink);text-decoration:none;white-space:nowrap;
  font:500 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background-color .25s,color .25s}
.btn:hover{background:var(--ink);color:#fff}
.btn.ink{background:var(--ink);color:#fff}.btn.ink:hover{background:#2A2A30}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#rail{position:fixed;z-index:60;left:24px;bottom:24px;display:flex;gap:20px;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#rail.show{opacity:1;visibility:visible}
.rl{display:flex;align-items:center;gap:8px;padding:6px 0;border:0;background:none;cursor:pointer;color:rgba(8,8,11,.5);font:400 11px/14px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;text-align:right}
.rl i{width:8px;height:8px;background:rgba(8,8,11,.3);order:0}
.rl em{font-style:normal;color:rgba(8,8,11,.35);order:1}
.rl span{order:2}
.rl.on{color:var(--ink)}.rl.on i{outline:1px solid var(--ink);outline-offset:3px}
.rl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hint{position:fixed;z-index:60;bottom:72px;left:50%;transform:translateX(-50%);font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:rgba(8,8,11,.6);opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}
#hint::after{content:"";display:block;width:1px;height:28px;margin:10px auto 0;background:rgba(8,8,11,.5);animation:hintLine 1.8s var(--e) infinite;transform-origin:top}
@keyframes hintLine{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#panel{position:fixed;z-index:61;right:40px;top:50%;width:380px;transform:translate(24px,-50%);opacity:0;transition:opacity .45s var(--e),transform .6s var(--e);
  background:rgba(245,245,245,.92);border:1px solid var(--line);padding:28px;display:grid;gap:14px}
#panel.in{opacity:1;transform:translate(0,-50%)}
#panel[hidden]{display:none}
#panel .pm{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
#panel h2{margin:0;font:500 40px/44px Outfit;letter-spacing:-1.5px}
#panel .pt{margin:-8px 0 4px;color:var(--t2)}
#panel ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#panel li{display:grid;grid-template-columns:32px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
#panel li b{font:400 12px/24px Mono,monospace;color:var(--t3);font-weight:400}
#panel .pa{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#panel .ph{margin:0;font:400 11px/14px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
body.r3focus #rail{opacity:.3}
@media (max-width:767px){
  .ttl{display:none}.esc{display:none}
  #rail{right:12px;top:auto;bottom:20px;transform:none;grid-auto-flow:column;gap:10px}.rl span,.rl em{display:none}.rl{padding:8px 0}
  .co .k{font-size:10px;letter-spacing:1.5px}.co .v{font-size:12px;line-height:15px}.co-a .v{font-size:16px;line-height:20px}
  #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:translateY(24px);padding:20px;gap:10px}#panel.in{transform:none}#panel h2{font-size:28px;line-height:32px}#panel li{font-size:14px;line-height:20px;padding:8px 0}
}
@media (prefers-reduced-motion:reduce){#veil,#view{transition:none}.ui-top{animation-duration:.01s;animation-delay:0s}#hint::after{animation:none}}
</style>
</head>
