:root{--bg:#F5F5F5;--ink:#08080B;--t2:#55555E;--t3:#8A8A93;--line:rgba(40,40,70,.12);--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1344px;margin:0 auto;padding:96px 48px}
.label{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
h1{font:500 64px/68px Outfit;letter-spacing:-2px;margin:12px 0 16px}
.lead{max-width:560px;color:var(--t2);font-size:18px;line-height:28px;margin:0}
.hero{display:grid;grid-template-columns:1fr 560px;gap:48px;align-items:center}
@media (max-width:1023px){.hero{grid-template-columns:1fr}.wrap{padding:64px 20px}h1{font-size:40px;line-height:44px}}
.slot{position:relative;width:min(560px,100%);aspect-ratio:1}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:opacity .4s var(--e)}
body.r3open .slot svg{opacity:0}
.slot .nm{font:400 11px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;fill:var(--t2)}
.slot .yy{font:400 10px Mono,monospace;letter-spacing:1px;fill:var(--t3)}
.open-btn{position:absolute;inset:0;background:none;border:0;cursor:zoom-in;border-radius:50%}
.open-btn:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.hint{margin-top:16px;font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t3);text-align:center}

#view{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 40%,#F7F7F5 0%,#EEEEEC 60%,#E4E4E6 100%);opacity:0;transition:opacity .45s var(--e);touch-action:none;user-select:none;-webkit-user-select:none}
#view.in{opacity:1}
#view[hidden]{display:none}
#view canvas{position:absolute;inset:0;display:block;cursor:grab}
#view.drag canvas{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);background:rgba(255,255,255,.92);
  font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--ink);white-space:nowrap;cursor:pointer;pointer-events:auto;
  opacity:0;visibility:hidden;transition:opacity .4s var(--e),visibility .4s;box-shadow:0 6px 18px rgba(8,8,11,.06)}
.tag i{width:8px;height:8px;flex:none}
.tag.show{opacity:1;visibility:visible}.tag.show.dim{opacity:.4}
.tag:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.yr{position:absolute;left:0;top:0;font:400 11px/1 Mono,monospace;letter-spacing:1px;color:var(--t3);opacity:0;transition:opacity .6s}
.yr.show{opacity:1}
body.r3focus .yr{opacity:0}
.ui{position:fixed;z-index:60;display:none}
body.r3open .ui{display:flex}
.ui-top{top:20px;left:20px;right:20px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.ui-top>*{pointer-events:auto}
.ttl{display:grid;gap:4px}.ttl b{font:500 28px/32px Outfit;letter-spacing:-1px}.ttl span{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 16px;border:1px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap;
  font:500 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#2A2A30}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ui-bot{bottom:20px;left:50%;transform:translateX(-50%);gap:8px;align-items:center;transition:opacity .3s}
body.r3focus .ui-bot{opacity:0;pointer-events:none}
.ui-bot .note{font:400 12px/16px Mono,monospace;letter-spacing:1px;color:var(--t2);margin-right:8px;text-transform:uppercase}
#panel{position:fixed;z-index:61;right:40px;top:50%;width:380px;transform:translate(24px,-50%);opacity:0;transition:opacity .45s var(--e),transform .6s var(--e);
  background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 24px 60px rgba(8,8,11,.12);padding:28px;display:grid;gap:16px}
#panel.in{opacity:1;transform:translate(0,-50%)}
#panel[hidden]{display:none}
#panel .mt{padding-right:76px;font:400 12px/16px Mono,monospace;letter-spacing:1px;text-transform:uppercase;color:var(--t2)}
#panel h2{margin:0;font:500 40px/44px Outfit;letter-spacing:-1.5px}
#panel ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#panel li{display:grid;grid-template-columns:32px 1fr;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:24px}
#panel li b{font:400 12px/24px Mono,monospace;color:var(--t3);font-weight:400}
#panel .pa{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
#panel .nav{position:absolute;top:28px;right:28px;display:flex;gap:4px}
#panel .sq{height:32px;min-width:32px;padding:0}
@media (max-width:767px){.ui-bot .note,.esc{display:none}.ttl b{font-size:22px;line-height:28px}
  #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:translateY(24px);padding:20px;gap:12px}
  #panel.in{transform:none}#panel h2{font-size:28px;line-height:32px}#panel li{font-size:14px;line-height:20px;padding:8px 0}#panel .nav{top:20px;right:20px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div>
      <span class="label">Прототип · мапа проєктів</span>
      <h1>Мапа проєктів</h1>
      <p class="lead">Натисни на радар – він ляже підлогою, а кейси піднімуться над ним у простір. Наведи чи тапни на обкладинку, щоб підлетіти до кейсу.</p>
    </div>
    <div>
      <div class="slot" id="slot">
        <svg viewBox="0 0 560 560" aria-hidden="true" id="flat"></svg>
        <button class="open-btn" id="openBtn" type="button" aria-label="Відкрити мапу проєктів у 3D"></button>
      </div>
      <p class="hint">Натисни, щоб зайти всередину</p>
    </div>
  </div>
</main>
<div id="view" hidden role="dialog" aria-modal="true" aria-label="Мапа проєктів у 3D"><div id="labels"></div></div>
<div id="panel" hidden role="group"></div>
<div class="ui ui-top">
  <div class="ttl"><b>Мапа проєктів</b><span>Кільця – роки · обкладинки – кейси</span></div>
  <button class="btn" id="closeBtn" type="button">Закрити<span class="esc">&nbsp;· Esc</span></button>
</div>
<div class="ui ui-bot">
  <span class="note">Тягни, щоб роззирнутися</span>
  <button class="btn" id="zOut" type="button" aria-label="Віддалити">−</button>
  <button class="btn" id="zIn" type="button" aria-label="Наблизити">+</button>
  <button class="btn" id="reset" type="button">Центр</button>
</div>

(function(){var P=[['Lunora','#6C58CE',158,-106],['Ulovo','#3778B8',48,-272],['TripStone','#D07A44',195,195],['Open Kharkiv','#1C7154',-106,158],['Numa','#9DB82E',-265,-76]];
var s='<circle cx="280" cy="280" r="276" fill="none" stroke="rgba(40,40,70,.18)"/><circle cx="280" cy="280" r="190" fill="none" stroke="rgba(40,40,70,.18)"/><circle cx="280" cy="280" r="104" fill="none" stroke="rgba(40,40,70,.18)"/><circle cx="280" cy="280" r="18" fill="none" stroke="rgba(40,40,70,.25)"/>'+
'<line x1="0" y1="280" x2="560" y2="280" stroke="rgba(40,40,70,.1)"/><line x1="280" y1="0" x2="280" y2="560" stroke="rgba(40,40,70,.1)"/>'+
