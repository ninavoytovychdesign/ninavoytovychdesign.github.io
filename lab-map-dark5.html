:root{--bg:#F5F5F5;--ink:#08080B;--t2:#55555E;--t3:#8A8A93;--line:rgba(40,40,70,.12);--acc:#E1E635;--w1:#FFFFFF;--w2:rgba(255,255,255,.62);--w3:rgba(255,255,255,.4);--wl:rgba(255,255,255,.14);--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1344px;margin:0 auto;padding:96px 48px}
.label{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
h1{font:500 64px/68px Outfit;letter-spacing:-2px;margin:12px 0 16px}
.lead{max-width:560px;color:var(--t2);font-size:18px;line-height:28px;margin:0}
.hero{display:grid;grid-template-columns:1fr 560px;gap:48px;align-items:center}
@media (max-width:1023px){.hero{grid-template-columns:1fr}.wrap{padding:64px 20px}h1{font-size:40px;line-height:44px}}
.slot{position:relative;width:min(560px,100%);aspect-ratio:1}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:opacity .4s var(--e)}
body.r3open .slot svg{opacity:0}
.slot .nm{font:400 11px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;fill:var(--t2)}
.slot .yy{font:400 10px Mono,monospace;letter-spacing:1px;fill:var(--t3)}
.open-btn{position:absolute;inset:0;background:none;border:0;cursor:zoom-in;border-radius:50%}
.open-btn:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.hint{margin-top:16px;font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--t3);text-align:center}

/* dark space */
@property --sw{syntax:'<angle>';inherits:true;initial-value:0deg}
/* entering: the radar beam makes one full turn and everything it passes switches to the dark space */
#veil,#view{--sw:0deg;transition:--sw 1.05s cubic-bezier(.55,0,.3,1)}
#veil.in,#view.in{--sw:360deg}
#veil{position:fixed;inset:0;z-index:52;pointer-events:none;
  background:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),transparent max(0deg,calc(var(--sw) - 30deg)),rgba(225,230,53,.12) calc(var(--sw) - 1.2deg),rgba(255,255,255,.9) calc(var(--sw) - 0.15deg),transparent var(--sw))}
#veil.full{display:none}
#view{-webkit-mask:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),#000 0deg,#000 max(0deg,calc(var(--sw) - 1deg)),transparent var(--sw));
  mask:conic-gradient(from 0deg at var(--vx,50%) var(--vy,50%),#000 0deg,#000 max(0deg,calc(var(--sw) - 1deg)),transparent var(--sw))}
#view.full{-webkit-mask:none;mask:none}
body.r3open .slot svg{transition:opacity .2s linear .95s}
#veil[hidden]{display:none}
#view{position:fixed;inset:0;z-index:50;opacity:0;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--w1)}
#view.in{opacity:1}
#view{transition:--sw 1.05s cubic-bezier(.55,0,.3,1)}
#view[hidden]{display:none}
#view canvas{position:absolute;inset:0;display:block;cursor:crosshair}
#view.drag canvas{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;display:grid;gap:2px;padding:6px 8px;border:0;background:transparent;color:#fff;text-align:center;cursor:pointer;pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .35s var(--e),visibility .35s}
.lb.show{opacity:1;visibility:visible}.lb.show.dim{opacity:.32}
.lb .ln{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:400 12px/16px Mono,monospace;letter-spacing:2.5px;white-space:nowrap;text-shadow:0 0 12px rgba(255,255,255,.45)}
.lb .ln i{width:8px;height:8px;box-shadow:0 0 10px currentColor}
.lb .lt{font:400 12px/16px Outfit;color:rgba(255,255,255,.55);white-space:nowrap;min-height:16px}
.lb.hot .ln b{color:var(--acc);text-shadow:0 0 14px rgba(225,230,53,.6)}.lb.hot .lt{color:rgba(255,255,255,.85)}
.lb:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.hit{position:absolute;left:0;top:0;width:150px;height:52px;padding:0;border:0;background:transparent;pointer-events:none;opacity:0}
.hit:focus-visible{opacity:1;outline:2px solid var(--acc);outline-offset:2px}
.hit[hidden]{display:none}
#xh{position:fixed;left:0;top:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .2s}
#xh.on{opacity:1}
#xh span{position:absolute;left:14px;top:12px;font:400 11px/14px Mono,monospace;letter-spacing:1.5px;color:rgba(255,255,255,.62);white-space:nowrap}
.tag{position:absolute;left:0;top:0;display:grid;grid-template-columns:8px auto;column-gap:8px;align-items:center;padding:6px 10px 7px;border:1px solid var(--wl);background:#0B0B0E;color:var(--w1);
  font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;cursor:pointer;pointer-events:auto;text-align:left;
  opacity:0;visibility:hidden;transition:opacity .35s var(--e),visibility .35s,border-color .25s,background-color .25s}
.tag i{width:8px;height:8px;grid-row:1}
.tag .tn{grid-column:2}
.tag .tt{grid-column:2;font:400 11px/14px Outfit;letter-spacing:0;text-transform:none;color:var(--w3);max-height:0;overflow:hidden;transition:max-height .3s var(--e)}
.tag.show{opacity:1;visibility:visible}.tag.show.dim{opacity:.35}
.tag.hot{border-color:var(--acc)}.tag.hot .tt{max-height:16px}
.tag:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.yr{position:absolute;left:0;top:0;font:400 11px/1 Mono,monospace;letter-spacing:1px;color:var(--w3);opacity:0;transition:opacity .6s,color .3s}
.yr.show{opacity:1}.yr.on{color:var(--acc)}
.ui{position:fixed;z-index:60;display:none;color:var(--w1)}
body.r3open .ui{display:flex}
.ui-top{top:20px;left:20px;right:20px;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;opacity:0;animation:uiIn .6s var(--e) 1.6s forwards}
.ui-top>*{pointer-events:auto}
@keyframes uiIn{to{opacity:1}}
.ttl{display:grid;gap:4px}.ttl b{font:500 28px/32px Outfit;letter-spacing:-1px}.ttl span{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--w2)}
.years{display:flex;flex-direction:column;align-items:center;gap:8px}
.years .row{display:flex;gap:4px;padding:4px;border:1px solid var(--wl);background:#000}
.yc{height:36px;padding:0 14px;border:0;background:transparent;color:var(--w2);font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background-color .25s,color .25s}
.yc:hover{color:var(--w1)}
.yc[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.yc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.years .st{font:400 11px/14px Mono,monospace;letter-spacing:1px;text-transform:uppercase;color:var(--w3);min-height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 16px;border:1px solid var(--wl);background:#000;color:var(--w1);text-decoration:none;white-space:nowrap;
  font:500 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.btn:hover{background:var(--w1);color:var(--ink);border-color:var(--w1)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--ink)}.btn.acc:hover{background:#EEF26A}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.ui-bot{bottom:24px;left:50%;transform:translateX(-50%);font:400 11px/14px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--w3);white-space:nowrap;transition:opacity .3s;opacity:0;animation:uiIn .6s var(--e) 2.6s forwards}
body.r3focus .ui-bot{opacity:0!important;animation:none}
#panel{position:fixed;z-index:61;right:40px;top:50%;width:380px;transform:translate(24px,-50%);opacity:0;transition:opacity .45s var(--e),transform .6s var(--e);
  background:#0B0B0E;border:1px solid var(--wl);padding:28px;display:grid;gap:14px;color:var(--w1)}
#panel.in{opacity:1;transform:translate(0,-50%)}
#panel[hidden]{display:none}
#panel .pm{font:400 12px/16px Mono,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--w2)}
#panel h2{margin:0;font:500 40px/44px Outfit;letter-spacing:-1.5px}
#panel .pt{margin:-8px 0 4px;color:var(--w2)}
#panel ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--wl)}
#panel li{display:grid;grid-template-columns:32px 1fr;padding:12px 0;border-bottom:1px solid var(--wl);font-size:16px;line-height:24px}
#panel li b{font:400 12px/24px Mono,monospace;color:var(--w3);font-weight:400}
#panel .pa{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#panel .ph{margin:0;font:400 11px/14px Mono,monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--w3)}
@media (max-width:767px){
  .lb .ln{font-size:10px;letter-spacing:1.5px;gap:6px}.lb .lt{font-size:10px;line-height:13px}
  .tag{font-size:10px;letter-spacing:1.5px;padding:4px 8px 5px;column-gap:6px}.tag i{width:6px;height:6px}
  .ttl{display:none}.ui-top{left:12px;right:12px}.years{align-items:flex-start}.yc{padding:0 10px}
  .esc{display:none}.ui-bot{white-space:normal;text-align:center;width:calc(100% - 40px)}
  #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:translateY(24px);padding:20px;gap:10px}
  #panel.in{transform:none}#panel h2{font-size:28px;line-height:32px}#panel li{font-size:14px;line-height:20px;padding:8px 0}
}
@media (prefers-reduced-motion:reduce){#veil{transition:none}.ui-top,.ui-bot{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div>
      <span class="label">Прототип · мапа проєктів</span>
      <h1>Мапа проєктів</h1>
      <p class="lead">Натисни на радар – і зайди всередину. Кільця – роки, на лініях – кейси. Клікни назву кейсу, щоб відкрити його і покрутити в руках.</p>
    </div>
    <div>
      <div class="slot" id="slot">
        <svg viewBox="0 0 560 560" aria-hidden="true" id="flat"></svg>
        <button class="open-btn" id="openBtn" type="button" aria-label="Відкрити мапу проєктів у 3D"></button>
      </div>
      <p class="hint">Натисни, щоб зайти всередину</p>
    </div>
  </div>
</main>
<div id="veil" hidden></div>
<div class="ui ui-top">
